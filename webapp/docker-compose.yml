services:
  web:
    build: .
    container_name: bot-forward-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override so the SQLite file lands on the mounted volume.
      DATABASE_URL: sqlite:////app/data/app.db
      ENVIRONMENT: prod
    volumes:
      - app_data:/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: bot-forward-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  app_data:
  caddy_data:
  caddy_config:
